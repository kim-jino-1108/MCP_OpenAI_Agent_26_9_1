                  - generic [ref=f8e200]:
                    - paragraph [ref=f8e206]: Put the crushed biscuits into a bowl with the melted butter. Mix it together thoroughly, then press the mixture into the base and sides of the tin. Chill for 10 minutes.
                    - paragraph [ref=f8e210]: Has your base turned out too crumbly? Be sure to make sure it's well chilled before you go to the next step - you can chill in the freezer if you're short on time!
              - generic [ref=f8e211]:
                - paragraph [ref=f8e212]: Step 3 of 4
                - generic [ref=f8e213]:
                  - img "Classic Banoffee Pie" [ref=f8e217]
                  - generic [ref=f8e219]:
                    - generic [ref=f8e224]:
                      - paragraph [ref=f8e225]: Place 75g butter and sugar into a heavy based, non-stick saucepan over a low heat, stirring all the time until the sugar has dissolved. Add the condensed milk and bring to a rapid boil for about a minute, stirring all the time for a thick golden caramel. Spread the caramel over the base, cool and then chill for 1 hour.
                      - paragraph [ref=f8e226]
                      - paragraph [ref=f8e227]
                      - paragraph [ref=f8e228]
                    - paragraph [ref=f8e232]: If your caramel's too runny, you probably didn't get it hot enough. The mixture needs to boil for 1 minute until it starts to thicken, but no more or it may catch and go grainy. To avoid it catching or going grainy, you should always use a heavy based, non-stick pan, keep stirring so it doesn't catch and make sure you use a timer!
              - generic [ref=f8e233]:
                - paragraph [ref=f8e234]: Step 4 of 4
                - generic [ref=f8e235]:
                  - img "Classic Banoffee Pie" [ref=f8e239]
                  - paragraph [ref=f8e247]: Carefully remove the pie from the tin and place on a serving plate. Slice the bananas and place on top of the caramel, top with the softly whipped cream. For the perfect finishing touch, dust with cocoa powder or use grated chocolate to decorate the banoffee pie. Chill until ready to serve.
